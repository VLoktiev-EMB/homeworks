; A homework project must live at homeworks/<id> (two levels below the
; repository root); every relative path, including the inherited partitions
; path, breaks at any other depth.
[platformio]
default_envs = esp32s3_espidf
extra_configs = ../../platformio.shared.ini

; Only extends and lib_deps: extends replaces list options wholesale, and the
; ESP-IDF builder generates the CMake files this project must not ship.
[env:esp32s3_espidf]
extends = esp32s3_espidf
lib_deps =
    common=symlink://../../lib/common
    port=symlink://../../lib/port
    espidf=symlink://../../lib/espidf
