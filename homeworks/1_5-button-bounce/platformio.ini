; A homework project must live at homeworks/<id> (two levels below the
; repository root); every relative path, including the inherited partitions
; path, breaks at any other depth.
[platformio]
default_envs = esp32s3_arduino
extra_configs = ../../platformio.shared.ini

; Only extends and lib_deps: extends replaces list options wholesale, so a
; repeated build_flags would drop the inherited -DBOARD_HAS_PSRAM.
[env:esp32s3_arduino]
extends = esp32s3_arduino
lib_deps =
    common=symlink://../../lib/common
    port=symlink://../../lib/port
    arduino=symlink://../../lib/arduino
