; A homework project must live at homeworks/<id> (two levels below the
; repository root); every relative path, including the inherited partitions
; path, breaks at any other depth.
[platformio]
default_envs = esp32s3_arduino
extra_configs = ../../platformio.shared.ini
; Project-level option: PlatformIO ignores test_dir inside an [env:] section.
test_dir = test

; Only extends and lib_deps: extends replaces list options wholesale, so a
; repeated build_flags would drop the inherited -DBOARD_HAS_PSRAM.
[env:esp32s3_arduino]
extends = esp32s3_arduino
lib_deps =
    common=symlink://../../lib/common
    port=symlink://../../lib/port
    arduino=symlink://../../lib/arduino

; The native environment is the only place lib/host and Unity appear. It is
; reached with `pio test -e native`, never with `pio run -e native`.
[env:native]
extends = native_unity
test_framework = unity
test_build_src = false
; extends replaces list options wholesale; repeat the parent's flags and add -Werror.
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror
lib_deps =
    common=symlink://../../lib/common
    port=symlink://../../lib/port
    host=symlink://../../lib/host
    throwtheswitch/Unity@2.6.1
