name: Police flasher smoke
version: 1
author: VLoktiev-EMB
steps:
  - wait-serial: "pattern ready"
  # Frame 0 of the alternating mode drives GPIO4 HIGH and holds 400 ms at speed
  # index 0, so a 100 ms delay stays inside the frame where the pin is high.
  - delay: 100ms
  - expect-pin:
      part-id: esp
      name: 4
      value: 1

  # Short press on btn1: advances mode from ALTERNATING to DOUBLE_FLASH
  - set-control:
      part-id: btn1
      name: pressed
      value: 1
  - delay: 50ms
  - set-control:
      part-id: btn1
      name: pressed
      value: 0
  - wait-serial: "mode: double_flash"

  # Long press on btn1: advances speed from normal (400ms) to fast (200ms)
  - set-control:
      part-id: btn1
      name: pressed
      value: 1
  - delay: 650ms
  - set-control:
      part-id: btn1
      name: pressed
      value: 0
  - wait-serial: "speed: fast"
