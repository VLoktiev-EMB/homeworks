minimum_pre_commit_version: '4.7.0'
# D-10: one `pre-commit install` wires both stages, so a novice cannot forget
# the pre-push half of the gate.
default_install_hook_types: [pre-commit, pre-push]

# `default_stages` defaults to ALL stages, so without this line every hook
# would also run at pre-push. D-08 reserves that stage for clang-tidy only, so
# each hook keeps the pre-commit stage unless it names its own `stages:`.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # entry: gitleaks git --pre-commit --redact --staged --verbose
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The text-normalizing hooks below carry no exclusions: every tracked text
      # file here is authored, and `gen_views.py` owns its own output byte for
      # byte.
      #
      # Every hook here names `stages: [pre-commit]` explicitly. This pinned
      # manifest declares `stages: [pre-commit, pre-push, manual]` for three of
      # its hooks, and a hook's own `stages` overrides the top-level
      # `default_stages` — without the per-hook declaration those three would
      # run at pre-push and break D-08's "pre-push runs clang-tidy only".
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=1024]
        stages: [pre-commit]

  # D-04: the hook is CHECK-ONLY. The mirror's default entry is
  # `clang-format -i`, which would rewrite and therefore repair the very file
  # it is meant to reject; overriding `entry` is what makes the gate meaningful.
  # D-06: the pinned `rev` is the delivery path, so the checker is byte-identical
  # on every machine and no Homebrew or system package is involved.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        entry: clang-format --dry-run --Werror
        args: [-style=file]
        types_or: [c, c++]
        stages: [pre-commit]

  # D-13: ruff's policy lives once, in the root `pyproject.toml`, which the hook
  # resolves from the repository root without a `-c` argument. D-06: the pinned
  # `rev` is the delivery path, never a system install.
  #
  # The hook id is `ruff-check`: `ruff` is a legacy alias, and `ruff-format`
  # would introduce a second mechanical rewrite that TOOL-03 does not require.
  # No `--fix` argument: 05/D-21 makes every lint hook check-only.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        stages: [pre-commit]

  # D-14: the policy file is resolved from the working directory, and the hook
  # runs from the repository root, so no `-c` argument is needed. D-06: the
  # pinned `rev` is the delivery path.
  #
  # `files` is the authored-YAML surface (D-14): the workflows, each homework's
  # metadata, the board profiles, the template sources, the hook file itself,
  # and `.yamllint.yaml` so the linter validates its own configuration. The
  # three generated views are deliberately absent — `gen_views.py --check` owns
  # their shape.
  #
  # `.github/workflows/` enters here only as a lint path. D-24 keeps CI wiring
  # in Phase 8; no workflow is edited for a lint finding.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: >-
          ^(\.github/workflows/|homeworks/[^/]+/homework\.yaml$|boards/[^/]+\.yaml$|templates/.*\.ya?ml$|\.pre-commit-config\.yaml$|\.yamllint\.ya?ml$)
        stages: [pre-commit]

  # D-11/D-12: authored Markdown only. `.planning/` holds 200+ phase artifacts,
  # `.agents/` is the generated skills mirror, and `.claude/CLAUDE.md` is the
  # generated adapter; none is authored prose. Every exclusion names a family
  # explicitly, so a new authored file is linted by default rather than
  # silently skipped.
  #
  # `.claude/skills/**` is NOT excluded: a canonical skill is authored Markdown
  # like any other document, while only its generated `.agents/` mirror is
  # owned by `gen_skills.py` (Pitfall 4). The negative lookahead is what keeps
  # that distinction; do not "fix" it into a blanket `.claude/` exclusion.
  #
  # D-06: the pinned `rev` is the delivery path; the hook pulls its own npm
  # dependencies into a pre-commit-managed node environment.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(\.planning/|\.agents/|\.claude/(?!skills/))
        stages: [pre-commit]

  # `.gitignore` only stops an accidental `git add .`; `git add -f` bypasses it,
  # so the ignore rules alone do not enforce "generated files are never
  # committed" (AGENTS.md). This hook asks git which TRACKED paths its own
  # ignore rules exclude, and fails if any of the declared generated paths is
  # among them.
  #
  # D-23 extends the generated-file list with the ESP-IDF build outputs that
  # land inside a project tree: `CMakeLists.txt`, `src/CMakeLists.txt` and
  # `sdkconfig.<env>`. The patterns are scoped to `homeworks/*/` so no
  # repository-wide filename is banned. The authored `sdkconfig.defaults` is
  # deliberately outside the list: a negation in `.gitignore` re-includes it
  # after the broad `sdkconfig.*` pattern, so `-i` (which lists only ignored
  # paths) can never return it. Every wildcard pathspec is double-quoted inside
  # the single-quoted `bash -c` body, or the inner shell would expand it against
  # the working tree and the pathspec would silently degrade. Git's own exit
  # status is bound with `|| exit 1` before the captured value is tested, so a
  # git error cannot pass as an empty result.
  #
  # `.skill-state` is D-13 checkpoint state: machine-specific, deletable and
  # never a repository artifact, so `git add -f` must not be able to commit it
  # (Pitfall 5).
  - repo: local
    hooks:
      - id: no-generated-files
        name: generated files are never committed
        language: system
        entry: >-
          bash -c 'tracked=$(git ls-files -ci --exclude-standard --
          compile_commands.json site .pio .skill-state
          "homeworks/*/CMakeLists.txt"
          "homeworks/*/src/CMakeLists.txt" "homeworks/*/sdkconfig.*") || exit 1;
          if [ -n "$tracked" ]; then echo "tracked generated paths:" >&2;
          echo "$tracked" >&2; exit 1; fi'
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # `ARCH-05` needs the dependency rule to fail locally, not only under
      # test. The `files` pattern names the checker and its allowlist as well as
      # the scanned tree on purpose: an edit to the rule set or to a policy entry
      # must be gated too, otherwise an invalid allowlist could be committed
      # without ever running the scan.
      - id: check-architecture
        name: shared-library dependency rule
        language: system
        entry: python3 scripts/check_architecture.py
        files: ^(lib/|homeworks/|scripts/architecture/|scripts/check_architecture\.py)
        pass_filenames: false
        stages: [pre-commit]

      # D-13: the pre-commit hook builds its own isolated Python environment
      # from these two pins and never depends on `uv`. The same two pins live in
      # the PEP 723 header of both entry scripts, so a bump changes three
      # declarations that are reviewed together.
      #
      # `templates/` is deliberately absent from `files`: an unrendered
      # `template.yaml`-era homework contains `{{homework_id}}` and is not valid
      # metadata. `scripts/new_homework` is present so an edit to the scaffold
      # that can change rendered metadata re-runs the gate (defense in depth).
      # `scripts/gen_views.py` is present for the same reason: it reads
      # `homework.yaml` through the shared loader, so an edit to the generator
      # must re-run the metadata gate too.
      # `boards/` is present so a board-profile edit re-runs this same
      # validator, which now checks `boards/<id>.yaml` as a second family.
      - id: check-metadata
        name: homework metadata contract
        language: python
        additional_dependencies: ["PyYAML==6.0.3", "jsonschema==4.26.0"]
        entry: python scripts/check_metadata.py
        files: ^(homeworks/|boards/|schema/|scripts/(check_metadata\.py|new_homework$|gen_views\.py$|metadata/))
        pass_filenames: false
        stages: [pre-commit]

      # D-05: the report contract needs a local enforcement point, and `meta`
      # runs the whole hook surface, so CI needs no new job. This hook is
      # CHECK-ONLY: it never regenerates, rewrites, or stages a file, so it
      # cannot repair the defect it is meant to catch. When it fails, edit the
      # report yourself and re-run it.
      #
      # The isolated hook environment carries only PyYAML: the checker is
      # stdlib-only and reads `homework.yaml` through the strict loader. If this
      # hook ever exits with `ModuleNotFoundError: jsonschema`, the import
      # boundary regressed: fix the boundary rather than adding jsonschema here.
      #
      # `files` names every input the contract reads — each homework's report,
      # metadata, and diagram; the report template; both standards; the checker
      # and its helpers — because a change to any of them can change the result
      # without touching a report. `pass_filenames` is false: the command scans
      # the tree and a per-file argument would narrow it.
      - id: check-report
        name: report and evidence contract
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        entry: python scripts/check_report.py
        # Folded, with `(?x)` so the line breaks stay outside the pattern: YAML
        # folding would otherwise join the alternatives with a space.
        files: >-
          (?x)^(homeworks/.*/(report\.md|homework\.yaml|assets/diagram\.json)$
          |templates/report/|docs/standards/(report|electrical-calculations)\.md$
          |scripts/check_report\.py$|scripts/report/)
        pass_filenames: false
        stages: [pre-commit]

      # D-21: the drift contract needs a local enforcement point, not only the
      # `generated-views` pull-request workflow. This hook is CHECK-ONLY: it
      # never regenerates and never stages a file, so it cannot repair the
      # drift it is meant to catch. When it fails, fix the tree yourself with
      #   uv run scripts/gen_views.py --all
      # review the diff, and commit the regenerated output.
      #
      # The isolated hook environment carries only PyYAML. That pin set is
      # correct because 05-01 split the pure path helpers
      # (`scripts/metadata/paths.py`) and the strict loader
      # (`scripts/metadata/yaml_loader.py`) out of the jsonschema-importing
      # `contract.py`. If this hook ever exits with
      # `ModuleNotFoundError: jsonschema`, the import boundary regressed: fix
      # the boundary rather than adding jsonschema to this environment.
      #
      # `files` names the generator, its metadata helpers and every input a
      # view reads, because a change to any of them can change the output
      # without touching a generated file. `pass_filenames` is false: the
      # command is `--all`, and a per-file argument would narrow it.
      - id: gen-views-check
        name: generated views are in sync
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        entry: python scripts/gen_views.py --all --check
        # Folded, with `(?x)` so the line breaks stay outside the pattern: YAML
        # folding would otherwise join the alternatives with a space.
        files: >-
          (?x)^(README\.md$|templates/views/|boards/|schema/|homeworks/
          |scripts/gen_views\.py$|scripts/metadata/|generated\.manifest$
          |platformio\.shared\.ini$|homeworks\.code-workspace$)
        pass_filenames: false
        stages: [pre-commit]

      # D-21: the skills mirror has the same local enforcement point as the
      # generated views. This hook is CHECK-ONLY: it never regenerates and
      # never stages a file, so it cannot repair the drift it is meant to
      # catch. When it fails, fix the tree yourself with
      #   uv run scripts/gen_skills.py
      # review the diff, and commit the regenerated mirror.
      #
      # The isolated hook environment needs no `additional_dependencies`: the
      # generator is stdlib-only and imports only the pure helpers under
      # `scripts/metadata/`. If it ever exits with `ModuleNotFoundError`, the
      # import boundary regressed; fix the boundary rather than adding a pin.
      #
      # `files` names the generator, its metadata helpers, both skill trees and
      # the ledger, because a change to any of them can change the output
      # without touching a generated file. `pass_filenames` is false: one run
      # owns the whole mirror and a per-file argument would narrow it.
      - id: gen-skills-check
        name: generated skills mirror is in sync
        language: python
        entry: python scripts/gen_skills.py --check
        # Folded, with `(?x)` so the line breaks stay outside the pattern: YAML
        # folding would otherwise join the alternatives with a space.
        files: >-
          (?x)^(\.claude/skills/|\.agents/skills/|scripts/gen_skills\.py$
          |scripts/metadata/|generated\.skills\.manifest$)
        pass_filenames: false
        stages: [pre-commit]

  # D-09 / Pitfall 3: `cpp-linter-hooks` SKIPS clang-tidy locally when no
  # compilation database exists and fails only when `CI` is set — the exact
  # inverse of the contract this phase needs. Worse, `--compile-commands=tests`
  # makes the hook run anyway, so the database-presence check disappears.
  #
  # This guard therefore owns the failure and runs FIRST: pre-commit executes
  # repositories in file order, so a guard placed after the clang-tidy repo
  # would never protect the gate. It validates and reports; it never generates
  # the database, never writes `.pio/`, and never skips silently. Exit 0 on a
  # fresh database, 1 when the database is absent or stale, 2 on an environment
  # error. Regenerating the database is a developer action, not a hook action.
  #
  # D-08a: the analysed set is the host translation units under
  # `lib/common/src` and `lib/host/src`. A header is not a translation unit: it
  # has no compile command of its own in `tests/compile_commands.json`, so
  # clang-tidy skips it — silently on 23.1.3, with `Skipping <file>. Compile
  # command not found.` on older builds — and exits 0. Passing a bare header
  # therefore produced a green hook that analysed nothing. Both hook patterns
  # stop at `.c`; a header is analysed only through a unit that includes it, and
  # `HeaderFilterRegex` (unanchored) is what lets those header diagnostics
  # surface. Native test translation units are out of scope because `pio test`
  # exposes no compiledb target; the gap is recorded in ADR 0013 and handed to
  # Phase 8.
  - repo: local
    hooks:
      - id: clang-tidy-db
        name: clang-tidy compilation database present
        language: system
        entry: python3 scripts/clang-tidy-db
        pass_filenames: false
        files: ^(lib/(common|host)/src/.*\.c)$
        stages: [pre-push]

  # D-07: clang-tidy is delivered only by this pinned hook, at 23.1.3 so it
  # matches clang-format. The platform's bundled `tool-clangtidy` 19.1.0 is
  # never used, and a `--version` the hook cannot resolve must surface as a
  # failure rather than silently degrade.
  #
  # The `files` pattern is identical to the guard's: a guard that fires while
  # clang-tidy stays silent is worse than no guard, because it reports a checked
  # tree that was never analysed.
  #
  # `entry` is overridden with `scripts/clang-tidy-hook`, which calls the same
  # pinned `run_clang_tidy` but fails on `Skipping ... Compile command not
  # found.` instead of hiding it. cpp-linter-hooks' own entry point prints
  # nothing for a passing run, so it cannot detect the skip.
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.8.1
    hooks:
      - id: clang-tidy
        entry: python scripts/clang-tidy-hook
        args: [--version=23.1.3, --compile-commands=tests]
        files: ^(lib/(common|host)/src/.*\.c)$
        stages: [pre-push]
