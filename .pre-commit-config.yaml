minimum_pre_commit_version: '4.7.0'
default_install_hook_types: [pre-commit]

# `default_stages` defaults to ALL stages, so without this line every hook
# would also run at pre-push. D-08 reserves that stage for clang-tidy only, so
# each hook keeps the pre-commit stage unless it names its own `stages:`.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # entry: gitleaks git --pre-commit --redact --staged --verbose

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored third-party bytes are pinned by
      # `docs/assets/vendor/katex/0.19.0/FILES.sha256` (D-07). The upstream
      # minified JavaScript carries no final newline, so a normalizing hook
      # would rewrite it and break the integrity gate. The vendor tree is
      # therefore excluded from both text-normalizing hooks.
      - id: trailing-whitespace
        exclude: ^docs/assets/vendor/
      - id: end-of-file-fixer
        exclude: ^docs/assets/vendor/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # D-04: the hook is CHECK-ONLY. The mirror's default entry is
  # `clang-format -i`, which would rewrite and therefore repair the very file
  # it is meant to reject; overriding `entry` is what makes the gate meaningful.
  # D-06: the pinned `rev` is the delivery path, so the checker is byte-identical
  # on every machine and no Homebrew or system package is involved.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        entry: clang-format --dry-run --Werror
        args: [-style=file]
        types_or: [c, c++]

  # D-13: ruff's policy lives once, in the root `pyproject.toml`, which the hook
  # resolves from the repository root without a `-c` argument. D-06: the pinned
  # `rev` is the delivery path, never a system install.
  #
  # The hook id is `ruff-check`: `ruff` is a legacy alias, and `ruff-format`
  # would introduce a second mechanical rewrite that TOOL-03 does not require.
  # No `--fix` argument: 05/D-21 makes every lint hook check-only.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check

  # D-14: the policy file is resolved from the working directory, and the hook
  # runs from the repository root, so no `-c` argument is needed. D-06: the
  # pinned `rev` is the delivery path.
  #
  # `files` is the authored-YAML surface (D-14): the workflows, each homework's
  # metadata, the board profiles, the template sources, the hook file itself,
  # and `.yamllint.yaml` so the linter validates its own configuration. The
  # generated `mkdocs.yml` is deliberately absent — `gen_views.py --check` owns
  # its shape, exactly as it owns the generated pages.
  #
  # `.github/workflows/` enters here only as a lint path. D-24 keeps CI wiring
  # in Phase 8; no workflow is edited for a lint finding.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: >-
          ^(\.github/workflows/|homeworks/[^/]+/homework\.yaml$|boards/[^/]+\.yaml$|templates/.*\.ya?ml$|\.pre-commit-config\.yaml$|\.yamllint\.ya?ml$)

  # `.gitignore` only stops an accidental `git add .`; `git add -f` bypasses it,
  # so the ignore rules alone do not enforce "generated files are never
  # committed" (AGENTS.md). This hook asks git which TRACKED paths its own
  # ignore rules exclude, and fails if any of the declared generated paths is
  # among them.
  #
  # D-23 extends the generated-file list with the ESP-IDF build outputs that
  # land inside a project tree: `CMakeLists.txt`, `src/CMakeLists.txt` and
  # `sdkconfig.<env>`. The patterns are scoped to `homeworks/*/` so no
  # repository-wide filename is banned. The authored `sdkconfig.defaults` is
  # deliberately outside the list: a negation in `.gitignore` re-includes it
  # after the broad `sdkconfig.*` pattern, so `-i` (which lists only ignored
  # paths) can never return it. Every wildcard pathspec is double-quoted inside
  # the single-quoted `bash -c` body, or the inner shell would expand it against
  # the working tree and the pathspec would silently degrade. Git's own exit
  # status is bound with `|| exit 1` before the captured value is tested, so a
  # git error cannot pass as an empty result.
  - repo: local
    hooks:
      - id: no-generated-files
        name: generated files are never committed
        language: system
        entry: >-
          bash -c 'tracked=$(git ls-files -ci --exclude-standard --
          compile_commands.json site .pio "homeworks/*/CMakeLists.txt"
          "homeworks/*/src/CMakeLists.txt" "homeworks/*/sdkconfig.*") || exit 1;
          if [ -n "$tracked" ]; then echo "tracked generated paths:" >&2;
          echo "$tracked" >&2; exit 1; fi'
        pass_filenames: false
        always_run: true

      # `ARCH-05` needs the dependency rule to fail locally, not only under
      # test. The `files` pattern names the checker and its allowlist as well as
      # the scanned tree on purpose: an edit to the rule set or to a policy entry
      # must be gated too, otherwise an invalid allowlist could be committed
      # without ever running the scan.
      - id: check-architecture
        name: shared-library dependency rule
        language: system
        entry: python3 scripts/check_architecture.py
        files: ^(lib/|homeworks/|scripts/architecture/|scripts/check_architecture\.py)
        pass_filenames: false

      # D-13: the pre-commit hook builds its own isolated Python environment
      # from these two pins and never depends on `uv`. The same two pins live in
      # the PEP 723 header of both entry scripts, so a bump changes three
      # declarations that are reviewed together.
      #
      # `templates/` is deliberately absent from `files`: an unrendered
      # `template.yaml`-era homework contains `{{homework_id}}` and is not valid
      # metadata. `scripts/new_homework` is present so an edit to the scaffold
      # that can change rendered metadata re-runs the gate (defense in depth).
      # `scripts/gen_views.py` is present for the same reason: it reads
      # `homework.yaml` through the shared loader, so an edit to the generator
      # must re-run the metadata gate too.
      # `boards/` is present so a board-profile edit re-runs this same
      # validator, which now checks `boards/<id>.yaml` as a second family.
      - id: check-metadata
        name: homework metadata contract
        language: python
        additional_dependencies: ["PyYAML==6.0.3", "jsonschema==4.26.0"]
        entry: python scripts/check_metadata.py
        files: ^(homeworks/|boards/|schema/|scripts/(check_metadata\.py|new_homework$|gen_views\.py$|metadata/))
        pass_filenames: false

      # D-21: the drift contract needs a local enforcement point, not only the
      # `generated-views` pull-request workflow. This hook is CHECK-ONLY: it
      # never regenerates and never stages a file, so it cannot repair the
      # drift it is meant to catch. When it fails, fix the tree yourself with
      #   uv run scripts/gen_views.py --all
      # review the diff, and commit the regenerated output.
      #
      # The isolated hook environment carries only PyYAML. That pin set is
      # correct because 05-01 split the pure path helpers
      # (`scripts/metadata/paths.py`) and the strict loader
      # (`scripts/metadata/yaml_loader.py`) out of the jsonschema-importing
      # `contract.py`. If this hook ever exits with
      # `ModuleNotFoundError: jsonschema`, the import boundary regressed: fix
      # the boundary rather than adding jsonschema to this environment.
      #
      # `files` names the generator, its metadata helpers and every input a
      # view reads, because a change to any of them can change the output
      # without touching a generated file. `pass_filenames` is false: the
      # command is `--all`, and a per-file argument would narrow it.
      - id: gen-views-check
        name: generated views are in sync
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        entry: python scripts/gen_views.py --all --check
        # Folded, with `(?x)` so the line breaks stay outside the pattern: YAML
        # folding would otherwise join the alternatives with a space.
        files: >-
          (?x)^(README\.md$|docs/|templates/views/|boards/|schema/|homeworks/
          |scripts/gen_views\.py$|scripts/metadata/|generated\.manifest$
          |mkdocs\.yml$|platformio\.shared\.ini$|homeworks\.code-workspace$)
        pass_filenames: false
