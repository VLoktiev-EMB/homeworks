site_name: Homeworks
site_url: https://vloktiev-emb.github.io/homeworks/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
plugins:
  - search
nav:
  - "Home": index.md
  - "Homeworks":
    - "1.3 Police Flasher": homeworks/1_3-police-flasher.md
  - "Boards":
    - "esp32-s3-devkitc-1": boards/esp32-s3-devkitc-1.md
  - "Standards":
      - "VS Code setup": standards/vscode.md
  - "Decisions":
      - "Decision record index": decisions/README.md
      - "Monorepo with independent PlatformIO projects": decisions/0001-monorepo-with-independent-projects.md
      - "Ports and adapters, no universal hardware abstraction layer": decisions/0002-ports-and-adapters-no-universal-hal.md
      - "Git policy and protected main branch": decisions/0003-git-policy-and-protected-main.md
      - "License and attribution": decisions/0004-license-and-attribution.md
      - "Asset and LFS policy": decisions/0005-asset-and-lfs-policy.md
      - "Public commit identity": decisions/0006-public-commit-identity.md
      - "Symlinked shared libraries via lib_deps and library.json": decisions/0007-symlink-shared-libraries.md
      - "Common depends on port; ports are consumer-owned": decisions/0008-common-depends-on-port.md
      - "Homework metadata contract": decisions/0009-homework-metadata-contract.md
      - "Python dependency policy": decisions/0010-python-dependency-policy.md
      - "Squash-merge commit title and message": decisions/0011-squash-merge-commit-message.md
      - "Formatting is a documented approximation of ESP-IDF style": decisions/0012-formatting-approximation.md
      - "clangd and the multi-root editor contract": decisions/0013-clangd-multi-root-contract.md
      - "Simulator selection and the platform-role matrix": decisions/0014-simulator-selection.md
validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/vendor/katex/0.19.0/katex.min.css
extra_javascript:
  - assets/vendor/katex/0.19.0/katex.min.js
  - assets/vendor/katex/0.19.0/contrib/auto-render.min.js
  - assets/vendor/katex/0.19.0/render-math.js
