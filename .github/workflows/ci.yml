name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "${release}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan PR commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
      - name: Scan recent commits for secrets
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --verbose --log-opts="HEAD~1..HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      - name: Install pre-commit environments
        run: pre-commit install-hooks
      - name: Run the hook surface
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Install wokwi-cli
        env:
          WOKWI_CLI_VERSION: 0.28.1
          WOKWI_CLI_SHA256: 869f194ee473257c6112ed58d786376527769020056320b0a49a37d9e7d3bdd7
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/wokwi-cli-linuxstatic-x64"
          release="https://github.com/wokwi/wokwi-cli/releases/download/v${WOKWI_CLI_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "${release}/wokwi-cli-linuxstatic-x64" \
            -o "$asset"
          echo "${WOKWI_CLI_SHA256}  ${asset}" | sha256sum -c -
          install -m 0755 "$asset" /usr/local/bin/wokwi-cli
      - name: Lint every diagram
        run: |
          set -euo pipefail
          found=0
          for diagram in homeworks/*/assets/diagram.json; do
            [ -e "$diagram" ] || continue
            found=1
            wokwi-cli lint --offline "$diagram"
          done
          [ "$found" -eq 1 ] || echo "no diagrams to lint"

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.shared.ini') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.2.0
      - name: Run native logic tests
        run: pio test -d tests -e native
      - name: Build affected homeworks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          build_all=0
          targets=""

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            diff_files=$(git diff --name-only "origin/$BASE_REF...HEAD")
            echo "::group::PR changed files"
            echo "$diff_files"
            echo "::endgroup::"

            if echo "$diff_files" | grep -qE '^(lib/|platformio\.shared\.ini|partitions/|scripts/pio/)'; then
              echo "Shared code or configuration changed; building all homeworks."
              build_all=1
            else
              targets=$(echo "$diff_files" | grep -oE '^homeworks/[^/]+' | sort -u || true)
            fi
          else
            echo "Non-pull-request event ($EVENT_NAME); building all homeworks."
            build_all=1
          fi

          if [ "$build_all" -eq 1 ]; then
            targets=$(find homeworks -mindepth 1 -maxdepth 1 -type d | sort)
          fi

          if [ -z "$targets" ]; then
            echo "No homework projects affected by changes in this PR. Skipping target firmware build."
          else
            for hw in $targets; do
              if [ -f "$hw/platformio.ini" ]; then
                echo "=== Building $hw ==="
                pio run -d "$hw"
              fi
            done
          fi

  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Run the Python suite
        run: uv run python -m unittest discover scripts/tests

  gate:
    name: gate
    needs: [meta, build, python-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every dependency succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          failed="$(printf '%s' "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key)=\(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "::error::required job did not succeed: ${failed//$'\n'/, }"
            exit 1
          fi
