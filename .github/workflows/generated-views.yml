name: generated-views

on:
  pull_request:
  workflow_dispatch:

# META-05 asks CI to fail on drift; it does not ask CI to repair it. A
# pull-request job runs contributor-controlled code, so it gets read access to
# the repository and nothing else: no secret, no write token, no
# `pull_request_target`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-views:
    name: generated views are in sync
    runs-on: ubuntu-24.04
    # The check reads committed files and one manifest; ten minutes is slack,
    # not a budget. Phase 8 owns the build matrix and does not live here.
    timeout-minutes: 10
    steps:
      # Pinned to the v7.0.1 commit, not the mutable `v7` major tag: a tag can
      # be repointed at other code between runs, a commit SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      # Only PyYAML: the generator's import graph is jsonschema-free by design
      # (05-01 split `paths.py` and `yaml_loader.py` out of `contract.py`), so
      # this environment is the end-to-end proof of that split. A
      # `ModuleNotFoundError: jsonschema` here is a boundary regression, not a
      # reason to install jsonschema.
      - name: Install PyYAML
        run: python -m pip install PyYAML==6.0.3
      # The same command the pre-commit hook runs, so there is one drift
      # contract. Check-only: the job never regenerates or commits.
      - name: Check generated views
        run: python scripts/gen_views.py --all --check
